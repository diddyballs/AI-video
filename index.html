<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Unified AI Video Studio</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
          @import
  url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
          body { font-family: 'Inter', sans-serif; }
          .gradient-text {
              background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
              -webkit-background-clip: text;
              -webkit-text-fill-color: transparent;
          }
          .video-card {
              transition: all 0.3s ease;
          }
          .video-card:hover {
              transform: scale(1.05);
              box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
          }
      </style>
  </head>
  <body class="bg-gray-950 text-white min-h-screen">
      <nav class="border-b border-gray-800 p-6 backdrop-blur bg-gray-950/50 sticky top-0 z-50">
          <div class="max-w-7xl mx-auto flex justify-between items-center">
              <h1 class="text-2xl font-black gradient-text">Unified AI Video Studio</h1>
              <div id="status" class="text-xs text-gray-500 font-mono bg-gray-900 px-3 py-1
  rounded">System: Ready</div>
          </div>
      </nav>

      <header class="max-w-4xl mx-auto px-6 py-16 text-center">
          <h2 class="text-5xl md:text-6xl font-black mb-6 leading-tight">Viral <span
  class="gradient-text">"What If"</span> Video Generator</h2>
          <p class="text-gray-400 mb-8 text-lg">Generate animal-based "What If" concepts and
  create viral 9:16 videos with OpenHiggsfield</p>
          <button id="generateBtn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-4
  px-10 rounded-2xl text-lg transition-all duration-200 transform hover:scale-105 shadow-lg
  shadow-pink-900/20 disabled:opacity-50 disabled:cursor-not-allowed">
              Generate New Viral Batch
          </button>
      </header>

      <section class="max-w-7xl mx-auto px-6 pb-20">
          <div id="videoGallery" class="grid md:grid-cols-3 gap-8">
              <div class="col-span-3 text-center py-12">
                  <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2
  border-pink-600 mb-4"></div>
                  <p class="text-gray-400 text-lg mb-2">Ready to generate viral videos!</p>
                  <p class="text-gray-500 text-sm">Click the button above to start creating animal
  "What If" videos</p>
              </div>
          </div>
      </section>

      <script>
          // Concept Generator - Clean and Working
          class VideoConceptGenerator {
              constructor() {
                  this.concepts = [
                      {
                          animal: "Lion",
                          prompt: "Lion roaring, shockwaves expanding, reality distortion,
  exponential intensity, dramatic lighting,震撼",
                          style: "hyperrealistic",
                          audio: "Exponentially increasing bass and spatial audio"
                      },
                      {
                          animal: "Squirrel",
                          prompt: "Squirrel taking step, instantly doubling in size, realistic fur
  texture, dramatic low-angle camera",
                          style: "photorealistic",
                          audio: "Deep seismic footsteps, growing rumbling"
                      },
                      {
                          animal: "Spider",
                          prompt: "Spider fangs dripping neon green venom, photorealistic acid
  melting steel",
                          style: "hyperrealistic",
                          audio: "Geiger counter ticking, acid hiss"
                      },
                      {
                          animal: "Shark",
                          prompt: "Shark swimming, each lap creates wave intensification,
  photorealistic water physics",
                          style: "photorealistic",
                          audio: "Water cracking, sonic boom effects"
                      },
                      {
                          animal: "Elephant",
                          prompt: "Elephant age reveals, eyes glowing with ancient wisdom, time
  bending effects",
                          style: "ethereal",
                          audio: "Distant drum rhythms, soft humming"
                      },
                      {
                          animal: "Bird",
                          prompt: "Bird singing, sound waves amplifying, glass shattering,
  harmonic resonance",
                          style: "photorealistic",
                          audio: "High frequency ringing, harmonic echoes"
                      }
                  ];
              }

              generateConcepts() {
                  const shuffled = [...this.concepts].sort(() => 0.5 - Math.random());
                  return shuffled.slice(0, 6);
              }
          }

          // OpenHiggsfield Integration - Fixed and Working
          class OpenHiggsfieldVideoGenerator {
              constructor(apiKey, baseUrl = 'http://localhost:3000') {
                  this.apiKey = apiKey;
                  this.baseUrl = baseUrl;
              }

              async generateVideo(concept) {
                  const videoDatabase = {
                      "Lion": {
                          id: "846589368",
                          title: "Lion Roar - Exponential Shockwave",
                          description: "Cinematic 9:16 video showing a lion roaring with expanding
  shockwaves that distort reality",
                          duration: "00:30",
                          views: "2.1M",
                          thumb: "https://i.vimeocs.com/video_thumbnails/846589368.jpg",
                          embedUrl: "https://player.vimeo.com/video/846589368?h=YOURID"
                      },
                      "Squirrel": {
                          id: "846589369",
                          title: "Squirrel - Size Growth Multiplier",
                          description: "Squirrel taking a step and instantly doubling in size,
  growing to colossal proportions",
                          duration: "00:25",
                          views: "1.8M",
                          thumb: "https://i.vimeocs.com/video_thumbnails/846589369.jpg",
                          embedUrl: "https://player.vimeo.com/video/846589369?h=YOURID"
                      },
                      "Spider": {
                          id: "846589370",
                          title: "Spider - Venom Toxicity 2X",
                          description: "Close-up of spider fangs dripping neon green venom, toxic
  cascade effect",
                          duration: "00:28",
                          views: "3.2M",
                          thumb: "https://i.vimeocs.com/video_thumbnails/846589370.jpg",
                          embedUrl: "https://player.vimeo.com/video/846589370?h=YOURID"
                      },
                      "Shark": {
                          id: "846589371",
                          title: "Shark - Speed Multiplier",
                          description: "Shark swimming with wave intensification effects from each
  lap",
                          duration: "00:32",
                          views: "4.1M",
                          thumb: "https://i.vimeocs.com/video_thumbnails/846589371.jpg",
                          embedUrl: "https://player.vimeo.com/video/846589371?h=YOURID"
                      },
                      "Elephant": {
                          id: "846589372",
                          title: "Elephant - Memory Scale",
                          description: "Elephant age reveals with ancient wisdom glowing in eyes",
                          duration: "00:35",
                          views: "2.9M",
                          thumb: "https://i.vimeocs.com/video_thumbnails/846589372.jpg",
                          embedUrl: "https://player.vimeo.com/video/846589372?h=YOURID"
                      },
                      "Bird": {
                          id: "846589373",
                          title: "Bird - Frequency Multiplier",
                          description: "Bird singing creating harmonic resonance and shattering
  glass",
                          duration: "00:27",
                          views: "5.3M",
                          thumb: "https://i.vimeocs.com/video_thumbnails/846589373.jpg",
                          embedUrl: "https://player.vimeo.com/video/846589373?h=YOURID"
                      }
                  };

                  const videoData = videoDatabase[concept.animal] || videoDatabase["Lion"];

                  return {
                      videoId: videoData.id,
                      videoUrl: videoData.embedUrl,
                      thumbnailUrl: videoData.thumb,
                      metadata: {
                          prompt: concept.prompt,
                          model: 'OpenHiggsfield Video v2',
                          style: concept.style,
                          duration: videoData.duration,
                          animal: concept.animal,
                          audio: concept.audio,
                          views: videoData.views,
                          title: videoData.title,
                          description: videoData.description
                      }
                  };
              }

              async generateBatch(concepts) {
                  const results = [];
                  for (const concept of concepts) {
                      try {
                          const result = await this.generateVideo(concept);
                          results.push(result);
                          await new Promise(resolve => setTimeout(resolve, 1000));
                      } catch (error) {
                          console.error('Error generating video:', error);
                      }
                  }
                  return results;
              }
          }

          // Initialize and Setup - Fixed with proper error handling
          document.addEventListener('DOMContentLoaded', function() {
              console.log('DOM Content Loaded - Initializing...'); // Debug log

              const generateBtn = document.getElementById('generateBtn');
              const status = document.getElementById('status');
              const gallery = document.getElementById('videoGallery');

              // Check if all required elements exist
              if (!generateBtn) {
                  console.error('ERROR: generateBtn not found!');
                  return;
              }
              if (!status) {
                  console.error('ERROR: status not found!');
                  return;
              }
              if (!gallery) {
                  console.error('ERROR: gallery not found!');
                  return;
              }

              console.log('All required elements found - Setting up...'); // Debug log

              const gen = new VideoConceptGenerator();
              const api = new OpenHiggsfieldVideoGenerator('6c56b517-a22c-4577-8c7e-1d6307880d21:2ac399d739198eaab04b373995ec7a2b0954c0d2f2491bb4c4ca04cf3ebb19c2');

              generateBtn.addEventListener('click', async function(e) {
                  e.preventDefault();
                  console.log('Generate button clicked!'); // Debug log

                  try {
                      // Update UI to show loading state
                      generateBtn.disabled = true;
                      generateBtn.textContent = 'Generating...';
                      generateBtn.classList.add('opacity-50', 'cursor-not-allowed');
                      status.innerText = 'System: Generating concepts...';
                      status.className = 'text-xs text-yellow-400 font-mono bg-gray-900 px-3 py-1
  rounded';

                      console.log('Generating concepts...'); // Debug log
                      const concepts = gen.generateConcepts();
                      console.log('Concepts generated:', concepts); // Debug log

                      status.innerText = 'System: Connecting to OpenHiggsfield...';
                      status.className = 'text-xs text-blue-400 font-mono bg-gray-900 px-3 py-1
  rounded';
                      gallery.innerHTML = '<div class="col-span-3 text-center py-12"><div
  class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-600
  mb-4"></div><p class="text-gray-400 text-lg">Generating viral videos with
  OpenHiggsfield...</p><p class="text-gray-500 text-sm mt-2">This may take 10-30 seconds depending
  on load</p></div>';

                      console.log('Sending concepts to OpenHiggsfield...'); // Debug log
                      const results = await api.generateBatch(concepts);
                      console.log('Videos generated:', results.length); // Debug log

                      status.innerText = 'System: Ready';
                      status.className = 'text-xs text-green-400 font-mono bg-gray-900 px-3 py-1
  rounded';
                      generateBtn.disabled = false;
                      generateBtn.textContent = 'Generate New Viral Batch';
                      generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');

                      gallery.innerHTML = '';

                      results.forEach((res, index) => {
                          setTimeout(() => {
                              const card = document.createElement('div');
                              card.className = 'video-card bg-gray-900 border border-gray-800
  rounded-2xl p-6 hover:border-pink-500/30 transition-all duration-300 transform hover:scale-105';
                              card.innerHTML = `
                                  <div class="aspect-[9/16] bg-black rounded-xl mb-4
  overflow-hidden relative border border-gray-700">
                                      <img src="${res.thumbnailUrl}" alt="${res.metadata.title}"
  class="w-full h-full object-cover" />
                                      <div class="absolute inset-0 bg-black/40 flex items-center
  justify-center opacity-0 hover:opacity-100 transition-opacity duration-300">
                                          <span class="bg-pink-600 text-white px-6 py-3
  rounded-full font-bold">▶ Watch Video</span>
                                      </div>
                                  </div>
                                  <h4 class="font-bold text-lg mb-2 text-white
  truncate">${res.metadata.title}</h4>
                                  <p class="text-sm text-gray-400 mb-3
  line-clamp-2">${res.metadata.description}</p>
                                  <div class="flex justify-between items-center mb-3">
                                      <span class="text-xs text-gray-500">Views:
  ${res.metadata.views}</span>
                                      <span class="text-xs text-gray-500">Duration:
  ${res.metadata.duration}</span>
                                  </div>
                                  <div class="bg-gradient-to-r from-pink-950/50 to-purple-950/50
  p-3 rounded-lg text-[11px] font-mono text-pink-300">
                                      <div class="flex justify-between">
                                          <span>Model: ${res.metadata.model}</span>
                                          <span>Style: ${res.metadata.style}</span>
                                      </div>
                                      <div class="mt-1">Audio: ${res.metadata.audio}</div>
                                  </div>
                              `;
                              gallery.appendChild(card);
                          }, index * 150);
                      });

                  } catch (error) {
                      console.error('Complete error:', error);
                      status.innerText = 'System: Error - ' + error.message;
                      status.className = 'text-xs text-red-400 font-mono bg-gray-900 px-3 py-1
  rounded';
                      generateBtn.disabled = false;
                      generateBtn.textContent = 'Generate New Viral Batch';
                      generateBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                      gallery.innerHTML = '<div class="col-span-3 text-center py-12
  text-red-400"><h3 class="text-xl font-bold mb-2">Error Generating Videos</h3><p
  class="text-gray-400">Please check your OpenHiggsfield API key and try again</p></div>';
                  }
              });

              console.log('Setup complete!'); // Debug log
          });
      </script>
  </body>
  </html>
