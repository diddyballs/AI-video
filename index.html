<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Unified AI Video Studio</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <script src="concept-generator.js"></script>
      <script src="openhiggsfield-integration.js"></script>
      <style>
          @import
  url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
          body { font-family: 'Inter', sans-serif; }
          .gradient-text { background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
      </style>
  </head>
  <body class="bg-gray-950 text-white min-h-screen">
      <nav class="border-b border-gray-800 p-6 backdrop-blur bg-gray-950/50 sticky top-0 z-50">
          <div class="max-w-7xl mx-auto flex justify-between items-center">
              <h1 class="text-2xl font-black gradient-text">Unified AI Video Studio</h1>
              <div id="status" class="text-xs text-gray-500 font-mono">System: Idle</div>
          </div>
      </nav>
      <header class="max-w-4xl mx-auto px-6 py-16 text-center">
          <h2 class="text-5xl md:text-6xl font-black mb-6 leading-tight">Viral <span
  class="gradient-text">"What If"</span> Video Generator</h2>
          <button id="generateBtn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-4 px-10
  rounded-2xl text-lg transition shadow-lg shadow-pink-900/20">
              Generate New Viral Batch
          </button>
      </header>
      <section class="max-w-7xl mx-auto px-6 pb-20">
          <div id="videoGallery" class="grid md:grid-cols-3 gap-8"></div>
      </section>
      <script>
          const gen = new VideoConceptGenerator();
          const api = new OpenHiggsfieldVideoGenerator();
          document.getElementById('generateBtn').addEventListener('click', async () => {
              const status = document.getElementById('status');
              const gallery = document.getElementById('videoGallery');
              status.innerText = 'System: Generating Concepts...';
              const concepts = gen.generateConcepts();
              status.innerText = 'System: Sending to OpenHiggsfield...';
              gallery.innerHTML = '<div class="col-span-3 text-center text-gray-500 italic">Generating
  videos...</div>';
              const results = await api.generateBatch(concepts);
              status.innerText = 'System: Ready';
              gallery.innerHTML = '';
              results.forEach(res => {
                  const card = document.createElement('div');
                  card.className = 'bg-gray-900 border border-gray-800 rounded-2xl p-6
  hover:border-pink-500/30 transition';
                  card.innerHTML = `
                      <div class="aspect-[9/16] bg-black rounded-xl mb-4 overflow-hidden relative border
  border-gray-700">
                          <img src="${res.thumbnailUrl}" class="w-full h-full object-cover opacity-80" />
                          <div class="absolute inset-0 flex items-center justify-center bg-black/40"><span
  class="text-white font-bold bg-white/10 px-4 py-2 rounded-full backdrop-blur">View</span></div>
                      </div>
                      <h4 class="font-bold text-lg mb-2 truncate">${res.metadata.prompt.split(':')[1]}</h4>
                  `;
                  gallery.appendChild(card);
              });
          });
      </script>
  </body>
  </html>
