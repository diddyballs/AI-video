<!DOCTYPE html>
  <html lang="en">
  <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Unified AI Video Studio</title>
      <script src="https://cdn.tailwindcss.com"></script>
      <style>
          @import
  url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap');
          body { font-family: 'Inter', sans-serif; }
          .gradient-text { background: linear-gradient(90deg, #ec4899, #8b5cf6, #3b82f6);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
          .video-thumbnail {
              background: linear-gradient(45deg, #333, #555);
              display: flex;
              align-items: center;
              justify-content: center;
          }
          .video-thumbnail video {
              width: 100%;
              height: 100%;
              object-fit: cover;
              display: none;
          }
          .video-thumbnail img {
              width: 100%;
              height: 100%;
              object-fit: cover;
          }
          .video-thumbnail:hover img {
              opacity: 0.7;
          }
      </style>
  </head>
  <body class="bg-gray-950 text-white min-h-screen">
      <nav class="border-b border-gray-800 p-6 backdrop-blur bg-gray-950/50 sticky top-0 z-50">
          <div class="max-w-7xl mx-auto flex justify-between items-center">
              <h1 class="text-2xl font-black gradient-text">Unified AI Studio</h1>
              <div id="status" class="text-xs text-gray-500 font-mono">System: Idle</div>
          </div>
      </nav>

      <header class="max-w-4xl mx-auto px-6 py-16 text-center">
          <h2 class="text-5xl md:text-6xl font-black mb-6 leading-tight">Viral <span
  class="gradient-text">"What If"</span> Video Generator</h2>
          <p class="text-gray-400 mb-8">Generate animal-based "What If" concepts and create viral 9:16
  videos with OpenHiggsfield</p>
          <button id="generateBtn" class="bg-pink-600 hover:bg-pink-700 text-white font-bold py-4 px-10
  rounded-2xl text-lg transition shadow-lg shadow-pink-900/20">
              Generate New Viral Batch
          </button>
      </header>

      <section class="max-w-7xl mx-auto px-6 pb-20">
          <div id="videoGallery" class="grid md:grid-cols-3 gap-8">
              <!-- Videos will appear here -->
          </div>
      </section>

      <script>
          // Concept Generator
          class VideoConceptGenerator {
              constructor() {
                  this.concepts = [
                      {
                          animal: "Lion",
                          prompt: "Lion roaring, shockwaves expanding, reality distortion, exponential
  intensity",
                          style: "hyperrealistic",
                          audio: "Exponentially increasing bass"
                      },
                      {
                          animal: "Squirrel",
                          prompt: "Squirrel taking step, instantly doubling in size, realistic fur, dramatic
  low-angle",
                          style: "photorealistic",
                          audio: "Deep seismic footsteps"
                      },
                      {
                          animal: "Spider",
                          prompt: "Spider fangs dripping neon green venom, acid melting steel",
                          style: "hyperrealistic",
                          audio: "Geiger counter ticking, acid hiss"
                      },
                      {
                          animal: "Shark",
                          prompt: "Shark swimming, each lap creates wave intensification, water physics",
                          style: "photorealistic",
                          audio: "Water cracking, sonic boom"
                      },
                      {
                          animal: "Elephant",
                          prompt: "Elephant age reveals, eyes glowing with ancient wisdom, time bending",
                          style: "ethereal",
                          audio: "Distant drums, humming"
                      },
                      {
                          animal: "Bird",
                          prompt: "Bird singing, sound waves amplifying, glass shattering, harmonic
  resonance",
                          style: "photorealistic",
                          audio: "High frequency ringing"
                      }
                  ];
              }

              generateConcepts() {
                  return [...this.concepts].sort(() => 0.5 - Math.random()).slice(0, 6);
              }
          }

          // Simple OpenHiggsfield Integration (Simulated for Demo)
          class OpenHiggsfieldVideoGenerator {
              constructor(apiKey, baseUrl = 'http://localhost:3000') {
                  this.apiKey = apiKey;
                  this.baseUrl = baseUrl;
              }

              async generateVideo(concept) {
                  // For demo purposes, we'll simulate the API response
                  // In real usage, you would send actual requests to OpenHiggsfield

                  const simulatedVideos = [
                      { id: 'video_lion', url: 'https://player.vimeo.com/video/846589368?h=YOURID', thumb:
  'https://i.vimeocs.com/video_thumbnails/846589368.jpg' },
                      { id: 'video_squirrel', url: 'https://player.vimeo.com/video/846589369?h=YOURID',
  thumb: 'https://i.vimeocs.com/video_thumbnails/846589369.jpg' },
                      { id: 'video_spider', url: 'https://player.vimeo.com/video/846589370?h=YOURID', thumb:
  'https://i.vimeocs.com/video_thumbnails/846589370.jpg' },
                      { id: 'video_shark', url: 'https://player.vimeo.com/video/846589371?h=YOURID', thumb:
  'https://i.vimeocs.com/video_thumbnails/846589371.jpg' },
                      { id: 'video_elephant', url: 'https://player.vimeo.com/video/846589372?h=YOURID',
  thumb: 'https://i.vimeocs.com/video_thumbnails/846589372.jpg' },
                      { id: 'video_bird', url: 'https://player.vimeo.com/video/846589373?h=YOURID', thumb:
  'https://i.vimeocs.com/video_thumbnails/846589373.jpg' }
                  ];

                  const video = simulatedVideos.find(v => v.id.includes(concept.animal.toLowerCase())) ||
  simulatedVideos[0];

                  return {
                      videoId: video.id,
                      videoUrl: video.url,
                      thumbnailUrl: video.thumb,
                      metadata: {
                          prompt: concept.prompt,
                          model: 'OpenHiggsfield Video v2',
                          style: concept.style,
                          duration: '00:15 - 00:45',
                          animal: concept.animal,
                          audio: concept.audio
                      }
                  };
              }

              async generateBatch(concepts) {
                  const results = [];
                  for (const concept of concepts) {
                      try {
                          const result = await this.generateVideo(concept);
                          results.push(result);
                          await new Promise(resolve => setTimeout(resolve, 1000));
                      } catch (error) {
                          console.error('Error:', error);
                      }
                  }
                  return results;
              }
          }

          // Initialize and setup
          const gen = new VideoConceptGenerator();
          const api = new OpenHiggsfieldVideoGenerator('6c56b517-a22c-4577-8c7e-1d6307880d21:2ac399d739198eaab04b373995ec7a2b0954c0d2f2491bb4c4ca04cf3ebb19c2');

          document.addEventListener('DOMContentLoaded', function() {
              const generateBtn = document.getElementById('generateBtn');
              const status = document.getElementById('status');
              const gallery = document.getElementById('videoGallery');

              if (!generateBtn || !status || !gallery) {
                  console.error('Required elements not found!');
                  return;
              }

              generateBtn.addEventListener('click', async function() {
                  try {
                      generateBtn.disabled = true;
                      generateBtn.textContent = 'Generating...';
                      status.innerText = 'System: Generating concepts...';
                      const concepts = gen.generateConcepts();
                      status.innerText = 'System: Connecting to OpenHiggsfield...';

                      gallery.innerHTML = '<div class="col-span-3 text-center py-12"><div
  class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-pink-600 mb-4"></div><p
  class="text-gray-400">Generating your viral videos...</p></div>';

                      const results = await api.generateBatch(concepts);

                      status.innerText = 'System: Ready';
                      generateBtn.disabled = false;
                      generateBtn.textContent = 'Generate New Viral Batch';

                      gallery.innerHTML = '';

                      results.forEach((res, index) => {
                          setTimeout(() => {
                              const card = document.createElement('div');
                              card.className = 'bg-gray-900 border border-gray-800 rounded-2xl p-6
  hover:border-pink-500/30 transition transform hover:scale-105';
                              card.innerHTML = `
                                  <div class="aspect-[9/16] bg-black rounded-xl mb-4 overflow-hidden
  relative border border-gray-700 video-thumbnail">
                                      <video class="w-full h-full object-cover" controls muted
  preload="metadata">
                                          <source src="${res.videoUrl}" type="video/mp4">
                                          Your browser does not support video.
                                      </video>
                                      <img src="${res.thumbnailUrl}" alt="${res.metadata.animal} video
  thumbnail" class="absolute inset-0 w-full h-full object-cover" />
                                  </div>
                                  <h4 class="font-bold text-lg mb-2">${res.metadata.animal} -
  ${res.metadata.prompt}</h4>
                                  <div class="flex justify-between text-xs text-gray-400 mb-3">
                                      <span>Model: ${res.metadata.model}</span>
                                      <span>Style: ${res.metadata.style}</span>
                                  </div>
                                  <div class="bg-pink-950/30 p-3 rounded-lg text-[11px] font-mono
  text-pink-300">
                                      <div>Audio: ${res.metadata.audio}</div>
                                      <div>Duration: ${res.metadata.duration}</div>
                                  </div>
                              `;

                              gallery.appendChild(card);
                          }, index * 200);
                      });

                  } catch (error) {
                      console.error('Error:', error);
                      status.innerText = 'System: Error - ' + error.message;
                      generateBtn.disabled = false;
                      generateBtn.textContent = 'Generate New Viral Batch';
                      gallery.innerHTML = '<div class="col-span-3 text-center py-12 text-red-400">Error
  generating videos. Please try again.</div>';
                  }
              });
          });
      </script>
  </body>
  </html>
  </html>
